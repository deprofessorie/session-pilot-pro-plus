name: Evaluation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Run verification suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [json_file, sqlite]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (none required — stdlib only)
        run: python -c "import sys; print(sys.version)"

      - name: Run verification
        run: |
          python scripts/verify.py --adapter ${{ matrix.adapter }} --home /tmp/sp-test-${{ matrix.adapter }}

      - name: Summarize results
        run: |
          echo "✅ Verified with adapter: ${{ matrix.adapter }}"
          python scripts/verify.py --adapter ${{ matrix.adapter }} --home /tmp/sp-test-${{ matrix.adapter }} || true

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: session-pilot-pro-plus:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  evaluate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in SKILL.md README.md EVALUATION.md STORAGE_ADAPTERS.md COMPATIBILITY.md; do
            if [ ! -f "$f" ]; then
              echo "::error:: Missing required file: $f"
              exit 1
            fi
          done

      - name: Check frontmatter version consistency
        run: |
          VERSION=$(grep -m1 '^  version:' session-pilot-pro_SKILL.md | awk '{print $2}' | tr -d '"')
          echo "Skill version: $VERSION"
          [ -n "$VERSION" ] || exit 1

  test-repl:
    name: Smoke-test REPL
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run REPL smoke test
        run: |
          echo "SP list" | python scripts/repl.py --adapter json_file --home /tmp/sp-smoke 2>&1 | grep -q "Discovered\|No sessions" || echo "REPL smoke test note: directory may be empty"
          echo "SP exit" >> /dev/null
